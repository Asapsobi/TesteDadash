/* ========== 3. STYLING ========== */
:root{
  --bg:#F2F4F9; --card:#FFFFFF; --ink:#1B2033; --muted:#667085; --line:#D3D9E6;

  --t2-bg:#FBF0D8; --t2-fg:#D9A441;
  --t3-bg:#FBE4EA; --t3-fg:#D9708A;
  --t4-bg:#EBE4F8; --t4-fg:#9378D1;
}
@media (prefers-color-scheme:dark){

    --center-bg:#27316B; --center-ink:#F2F4FF;
    --t0-bg:#1D2644; --t0-fg:#6C86D6;
    --t1-bg:#173129; --t1-fg:#4DA894;
    --t2-bg:#33291A; --t2-fg:#C4953B;

*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.8;font-size:15px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.page{max-width:1120px;margin:0 auto;padding:40px 24px 64px}
.view{animation:enter .22s ease-out}
@keyframes enter{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}}

.head{text-align:center;margin-bottom:36px}
.head h1{font-size:20px;font-weight:700;direction:ltr;color:var(--accent)}

/* central box (root statement or topic question) */
.center{max-width:640px;margin:0 auto;text-align:center;padding:28px 32px;background:var(--center-bg);color:var(--center-ink);border-radius:10px;box-shadow:0 6px 20px -10px rgba(46,59,120,.55)}
.center h2{font-size:20px;font-weight:700;line-height:1.9}

/* branches + connectors */
.stem{width:1px;height:28px;background:var(--line);margin:0 auto}
.branches{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;padding-top:28px}
.node{position:relative;flex:1 1 160px;max-width:260px;text-align:right;background:var(--tone-bg);border:1px solid var(--line);border-top:3px solid var(--tone-fg);border-radius:6px;padding:16px 16px 18px;transition:border-color .15s,transform .15s}
.node::before{content:"";position:absolute;top:-31px;right:50%;height:28px;width:1px;background:var(--line)}
.node::after{content:"";position:absolute;top:-31px;inset-inline:-8px;height:1px;background:var(--line)}
.node:first-child::after{inset-inline-start:50%}
.node:last-child::after{inset-inline-end:50%}
.node:only-child::after{display:none}
.node:hover{border-color:var(--tone-fg);transform:translateY(-2px)}
.node h3{font-size:15px;font-weight:700;line-height:1.8}
.node.placeholder{background:transparent;border:1px dashed var(--line);min-height:84px;cursor:default}
.node.placeholder:hover{border-color:var(--line)}
.tone-0{--tone-bg:var(--t0-bg);--tone-fg:var(--t0-fg)}
.tone-1{--tone-bg:var(--t1-bg);--tone-fg:var(--t1-fg)}
.tone-2{--tone-bg:var(--t2-bg);--tone-fg:var(--t2-fg)}
.tone-3{--tone-bg:var(--t3-bg);--tone-fg:var(--t3-fg)}
.tone-4{--tone-bg:var(--t4-bg);--tone-fg:var(--t4-fg)}

/* detail */
.back{color:var(--accent);margin-bottom:24px;padding:2px 0}
.back:hover{text-decoration:underline}
.crumb{color:var(--muted);font-size:13px;margin-bottom:6px}
.detail{max-width:760px}
.detail h2{font-size:24px;font-weight:700;line-height:1.7;padding-inline-start:14px;border-inline-start:4px solid var(--tone-fg)}
.detail h2{margin-bottom:28px}
.detail .desc{color:var(--muted);margin:-20px 0 32px}
.group h4{font-size:14px;font-weight:700;color:var(--accent);margin-bottom:10px}
.group + .group{margin-top:28px}
.items{list-style:none;padding:0;background:var(--card);border:1px solid var(--line);border-radius:6px}
.item{padding:12px 18px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{font-weight:500}
.subq{margin:6px 0 2px;padding-inline-start:18px;font-size:14px}
.empty{color:var(--muted);font-size:13px;margin-top:2px}
.topic-empty{max-width:640px;margin:0 auto;text-align:center;background:transparent}
.empty-box{border:1px dashed var(--line);background:var(--tone-bg);border-radius:6px;padding:20px;color:var(--muted);font-size:14px}

@media (max-width:760px){
  .node{max-width:none;flex-basis:100%}
  .node::before,.node::after,.stem{display:none}
  .branches{padding-top:20px}
}
</style>
</head>

/* ========== 2. RENDERING ========== */
const app = document.getElementById("app");
const tone = i => "tone-" + (i % 5);

function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  kids.flat().forEach(c => c != null && el.append(c));
  return el;
}

const header = () => h("header", { class: "head" }, h("h1", {}, researchMap.title));

function branches(list, onOpen) {
  return [
    h("div", { class: "stem" }),
    h("div", { class: "branches" },
      list.map((n, i) => n.placeholder
        ? h("div", { class: "node placeholder", "aria-hidden": "true" })
        : h("button", { class: "node " + tone(i), onclick: () => onOpen(n) },
          h("h3", {}, n.title))))
  ];
}

/* سطح ۱: نقشهٔ اصلی */
function renderRoot() {
  return h("main", { class: "view" },
    header(),
    h("section", { class: "center" }, h("h2", {}, researchMap.rootStatement)),
    branches(researchMap.topics, t => go(t.id)));
}

/* سطح ۲: یک سوال سطح بالا و حوزه‌هایش */
function renderTopic(topic) {
  return h("main", { class: "view" },
    h("button", { class: "back", onclick: () => go() }, "→ بازگشت به نقشه اصلی"),
    h("section", { class: "center" }, h("h2", {}, "«" + topic.mainQuestion + "»")),
    topic.areas.length
      ? branches(topic.areas, a => go(topic.id, a.id))
      : [h("div", { class: "stem" }),
         h("div", { class: "empty-box topic-empty" }, "حوزه‌های پژوهشی این سوال هنوز اضافه نشده‌اند و بعداً اینجا تکمیل می‌شوند.")]);
}

function renderItem(item) {
  const qs = item.questions || [];
  return h("li", { class: "item" },
    h("div", { class: "t" }, item.title),
    qs.length
      ? h("ul", { class: "subq" }, qs.map(q => h("li", {}, q)))
      : h("div", { class: "empty" }, "زیرسوال‌ها هنوز اضافه نشده‌اند."));
}

/* سطح ۳: یک حوزهٔ پژوهشی */
function renderArea(topic, area, index) {
  const groups = area.groups || [];
  return h("main", { class: "view " + tone(index) },
    h("button", { class: "back", onclick: () => go(topic.id) }, "→ بازگشت به نقشهٔ این سوال"),
    h("div", { class: "detail" },
      h("div", { class: "crumb" }, "«" + topic.mainQuestion + "»"),
      h("h2", {}, area.title),
      area.description ? h("p", { class: "desc" }, area.description) : null,
      groups.length
        ? groups.map(g => h("section", { class: "group" },
            h("h4", {}, g.title),
            h("ul", { class: "items" }, g.items.map(renderItem))))
        : h("div", { class: "empty-box" }, area.emptyText || "زیرسوال‌ها هنوز اضافه نشده‌اند و بعداً اینجا تکمیل می‌شوند.")));
}

/* ========== 4. INTERACTION (hash routing: #/topicId/areaId) ========== */
function go(topicId, areaId) {
  location.hash = topicId ? "/" + topicId + (areaId ? "/" + areaId : "") : "/";
}

function route() {
  const [topicId, areaId] = location.hash.replace(/^#\/?/, "").split("/");
  const topic = researchMap.topics.find(t => t.id === topicId && !t.placeholder);
  const ai = topic ? topic.areas.findIndex(a => a.id === areaId) : -1;
  app.replaceChildren(
    !topic ? renderRoot() :
    ai < 0 ? renderTopic(topic) :
    renderArea(topic, topic.areas[ai], ai));
  window.scrollTo(0, 0);
}

window.addEventListener("hashchange", route);
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && location.hash.replace(/^#\/?/, "")) history.back();
});
route();
</script>
